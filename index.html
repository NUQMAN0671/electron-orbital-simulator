<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electron Orbital Simulator</title>
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js & OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Left Sidebar Controls -->
  <aside id="sidebar">
    <header>
      <h1>Electron Orbital Simulator</h1>
      <p class="subtitle">3D Quantum & Bohr Atomic Models</p>
    </header>

    <div class="control-group">
      <label for="mode-select">Visualization Mode</label>
      <select id="mode-select">
        <option value="orbital">3D Electron Orbital Cloud</option>
        <option value="bohr">Bohr Atomic Model</option>
      </select>
    </div>

    <div class="control-group">
      <label>Periodic Table</label>
      <div id="periodic-table"></div>
    </div>

    <div class="control-group">
      <label>Electron Configuration</label>
      <div id="config-panel">
        <div id="config-string"></div>
        <div id="orbital-chips" class="orbital-box-container"></div>
      </div>
    </div>
  </aside>

  <!-- Right 3D Viewport -->
  <main id="viewport">
    <div id="info-overlay">
      <h2 id="element-display">Hydrogen (H)</h2>
      <p id="details-display">Atomic Number: 1</p>
    </div>
    <div id="canvas-container"></div>
  </main>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
