<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electron Orbital Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left Sidebar - Periodic Table & Controls */
    #sidebar {
      width: 420px;
      background-color: #161b22;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      overflow-y: auto;
      z-index: 10;
    }

    h1 { font-size: 1.2rem; color: #58a6ff; }
    .subtitle { font-size: 0.8rem; color: #8b949e; margin-top: -12px; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label { font-size: 0.85rem; font-weight: bold; color: #8b949e; text-transform: uppercase; }

    select, button {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
    }
    select:hover, button:hover { border-color: #58a6ff; }

    /* Periodic Table Grid */
    #periodic-table {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      gap: 2px;
      background: #0d1117;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }

    .element-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: bold;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }
    .element-btn:hover { background: #30363d; border-color: #58a6ff; }
    .element-btn.active { background: #1f6feb; color: #fff; border-color: #58a6ff; }
    .element-btn.empty { visibility: hidden; pointer-events: none; }

    /* Electron Configuration UI */
    #config-panel {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
    }

    .orbital-box-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .orbital-chip {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: monospace;
      cursor: pointer;
    }
    .orbital-chip:hover, .orbital-chip.active {
      border-color: #238636;
      background: #2e7d32;
      color: #fff;
    }

    /* Right Viewport - 3D Render */
    #viewport {
      flex: 1;
      position: relative;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    #info-overlay {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      padding: 12px 16px;
      border-radius: 6px;
      pointer-events: none;
      text-align: right;
    }
    #info-overlay h2 { font-size: 1.1rem; color: #58a6ff; }
    #info-overlay p { font-size: 0.85rem; color: #8b949e; }
  </style>

  <!-- Three.js and OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    </div>

    let currentMode = "orbital";

    // --- 3. THREE.JS INITIALIZATION ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 5, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Group to hold all dynamic 3D elements
    const atomGroup = new THREE.Group();
    scene.add(atomGroup);

    // --- 4. 3D PROCEDURAL BUILDERS ---

    function clearScene() {
      while (atomGroup.children.length > 0) {
        const obj = atomGroup.children[0];
        atomGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
      }
    }

    function createNucleus(size = 0.5) {
      const geo = new THREE.SphereGeometry(size, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff4d4d, roughness: 0.3, metalness: 0.2 });
      return new THREE.Mesh(geo, mat);
    }

    // Generate S-Orbital (Sphere)
    function createSOrbital(n, color = 0x58a6ff) {
      const radius = n * 1.2;
      const geo = new THREE.SphereGeometry(radius, 32, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: color,
        transparent: true,
        opacity: 0.35,
        wireframe: false,
        side: THREE.DoubleSide
      });
      return new THREE.Mesh(geo, mat);
    }

    // Generate P-Orbital (Dumbbell along X, Y, or Z axis)
    function createPOrbital(n, axis = 'z') {
      const group = new THREE.Group();
      const radius = n * 0.8;
      const geo = new THREE.SphereGeometry(radius, 32, 32);

      const matPos = new THREE.MeshStandardMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.45 });
      const matNeg = new THREE.MeshStandardMaterial({ color: 0xffa657, transparent: true, opacity: 0.45 });

      const lobePos = new THREE.Mesh(geo, matPos);
      const lobeNeg = new THREE.Mesh(geo, matNeg);

      const offset = radius * 0.9;

      if (axis === 'z') {
        lobePos.position.z = offset;
        lobeNeg.position.z = -offset;
        lobePos.scale.set(0.7, 0.7, 1.2);
        lobeNeg.scale.set(0.7, 0.7, 1.2);
      } else if (axis === 'x') {
        lobePos.position.x = offset;
        lobeNeg.position.x = -offset;
        lobePos.scale.set(1.2, 0.7, 0.7);
        lobeNeg.scale.set(1.2, 0.7, 0.7);
      } else if (axis === 'y') {
        lobePos.position.y = offset;
        lobeNeg.position.y = -offset;
        lobePos.scale.set(0.7, 1.2, 0.7);
        lobeNeg.scale.set(0.7, 1.2, 0.7);
      }

      group.add(lobePos);
      group.add(lobeNeg);
      return group;
    }

    // Render Bohr Model
    const bohrElectrons = [];
    function buildBohrModel(element) {
      clearScene();
      bohrElectrons.length = 0;

      const nucleus = createNucleus(0.6);
      atomGroup.add(nucleus);

      let totalElectrons = element.z;
      // Distribute electrons into shell limits (2, 8, 8, ...)
      const shellLimits = [2, 8, 8, 18];
      let shellIndex = 0;

      while (totalElectrons > 0) {
        const electronsInShell = Math.min(totalElectrons, shellLimits[shellIndex]);
        const radius = (shellIndex + 1) * 2;

        // Render Ring
        const ringGeo = new THREE.RingGeometry(radius - 0.02, radius + 0.02, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x30363d, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        atomGroup.add(ring);

        // Add Electrons
        for (let i = 0; i < electronsInShell; i++) {
          const angle = (i / electronsInShell) * Math.PI * 2;
          const eGeo = new THREE.SphereGeometry(0.15, 16, 16);
          const eMat = new THREE.MeshStandardMaterial({ color: 0x58a6ff, emissive: 0x1f6feb });
          const electron = new THREE.Mesh(eGeo, eMat);

          electron.userData = { radius, angle, speed: 0.02 / (shellIndex + 1) };
          atomGroup.add(electron);
          bohrElectrons.push(electron);
        }

        totalElectrons -= electronsInShell;
        shellIndex++;
      }
    }

    // Render Quantum Orbital Cloud View
    function buildOrbitalView(element) {
      clearScene();
      atomGroup.add(createNucleus(0.4));

      const axes = ['x', 'y', 'z'];

      element.config.forEach(subshell => {
        const n = parseInt(subshell[0]);
        const type = subshell[1];
        const count = parseInt(subshell[2]);

        if (selectedOrbitalFilter !== "ALL" && !subshell.startsWith(selectedOrbitalFilter)) {
          return; // Skip if filtered out
        }

        if (type === 's') {
          atomGroup.add(createSOrbital(n));
        } else if (type === 'p') {
          for (let i = 0; i < Math.min(count, 3); i++) {
            atomGroup.add(createPOrbital(n, axes[i]));
          }
        }
      });
    }

    function updateRender() {
      if (currentMode === "bohr") {
        buildBohrModel(currentElement);
      } else {
        buildOrbitalView(currentElement);
      }
      
      document.getElementById('element-display').innerText = `${currentElement.name} (${currentElement.sym})`;
      document.getElementById('details-display').innerText = `Atomic Number: ${currentElement.z}`;
    }

    // --- 5. UI BUILDING & EVENTS ---
    function initUI() {
      const grid = document.getElementById('periodic-table');
      
      // Build 3x18 Grid
      for (let r = 1; r <= 3; r++) {
        for (let c = 1; c <= 18; c++) {
          const item = GRID_LAYOUT.find(e => e.row === r && e.col === c);
          const btn = document.createElement('div');
          
          if (item) {
            const elementData = ELEMENTS.find(e => e.z === item.z);
            btn.className = `element-btn ${elementData.z === currentElement.z ? 'active' : ''}`;
            btn.innerText = elementData.sym;
            btn.onclick = () => {
              document.querySelectorAll('.element-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              currentElement = elementData;
              selectedOrbitalFilter = "ALL";
              renderConfigUI();
              updateRender();
            };
          } else {
            btn.className = 'element-btn empty';
          }
          grid.appendChild(btn);
        }
      }

      // Mode Selector
      document.getElementById('mode-select').onchange = (e) => {
        currentMode = e.target.value;
        updateRender();
      };

      renderConfigUI();
    }

    function renderConfigUI() {
      const configStr = document.getElementById('config-string');
      const chipsContainer = document.getElementById('orbital-chips');

      configStr.innerText = currentElement.config.join(" ");
      chipsContainer.innerHTML = "";

      // 'ALL' Chip
      const allChip = document.createElement('div');
      allChip.className = `orbital-chip ${selectedOrbitalFilter === "ALL" ? 'active' : ''}`;
      allChip.innerText = "Show All";
      allChip.onclick = () => {
        selectedOrbitalFilter = "ALL";
        renderConfigUI();
        updateRender();
      };
      chipsContainer.appendChild(allChip);

      // Individual Subshell Chips
      currentElement.config.forEach(sub => {
        const label = sub.substring(0, 2); // e.g., "1s", "2p"
        const chip = document.createElement('div');
        chip.className = `orbital-chip ${selectedOrbitalFilter === label ? 'active' : ''}`;
        chip.innerText = sub;
        chip.onclick = () => {
          selectedOrbitalFilter = label;
          renderConfigUI();
          updateRender();
        };
        chipsContainer.appendChild(chip);
      });
    }

    // --- 6. ANIMATION & RESIZE LOOPS ---
    function animate() {
      requestAnimationFrame(animate);

      // Rotate Atom Group gently
      atomGroup.rotation.y += 0.003;

      // Animate Bohr Electrons
      if (currentMode === "bohr") {
        bohrElectrons.forEach(e => {
          e.userData.angle += e.userData.speed;
          e.position.x = Math.cos(e.userData.angle) * e.userData.radius;
          e.position.z = Math.sin(e.userData.angle) * e.userData.radius;
        });
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Start App
    initUI();
    updateRender();
    animate();
  </script>
</body>
</html>
